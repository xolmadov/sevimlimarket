<div id="app"></div><div id="toast"></div>
<script>
/* fx.js: mahsulot rasmini bir xil kvadrat kadrga keltiradi.
   Mijoz sayti va admin panel birga ishlatadi.

   SQ.build(rasm, oʻlcham) -> <canvas> (oʻlcham x oʻlcham)
     oq yoki bir xil rangli fon -> fon oqqa almashadi, mahsulot kesib olinib markazga, bir xil boʻshliq bilan qoʻyiladi
     fonli surat (foto)         -> kvadratni toʻldiradi; juda uzun/keng boʻlsa kesilmaydi, oʻz rangidagi fonga joylanadi
   SQ.done(url) -> rasm allaqachon tayyorlanganmi (fayl nomi "sq-" bilan boshlanadi) */
(function(){
const DONE=/\/sq-[\w]+\.(?:jpg|webp)(?:\?|$)/;
function build(src,S){
  S=S||800;
  const W=src.naturalWidth||src.width,H=src.naturalHeight||src.height;
  if(!W||!H)throw new Error('Rasm oʻlchami nomaʼlum');
  const k=Math.min(1,S/Math.max(W,H)),w=Math.max(2,Math.round(W*k)),h=Math.max(2,Math.round(H*k));
  const cv=document.createElement('canvas');cv.width=w;cv.height=h;
  const cx=cv.getContext('2d',{willReadFrequently:true});cx.fillStyle='#fff';cx.fillRect(0,0,w,h);cx.drawImage(src,0,0,w,h);
  const img=cx.getImageData(0,0,w,h),px=img.data,P=[],Cn=[];
  for(let b=0;b<2;b++){for(let x=0;x<w;x++){P.push((b*w+x)*4,((h-1-b)*w+x)*4)}for(let y=0;y<h;y++){P.push((y*w+b)*4,(y*w+w-1-b)*4)}}
  const cs=Math.max(2,Math.round(Math.min(w,h)*.06));
  for(const[ox,oy]of[[0,0],[w-cs,0],[0,h-cs],[w-cs,h-cs]])for(let y=0;y<cs;y++)for(let x=0;x<cs;x++)Cn.push(((oy+y)*w+ox+x)*4);
  const isW=i=>px[i]>=246&&px[i+1]>=246&&px[i+2]>=246,fr=(L,f)=>{let n=0;for(const i of L)if(f(i))n++;return n/L.length};
  const md=L=>[0,1,2].map(c=>{const v=L.map(i=>px[i+c]).sort((a,b)=>a-b);return v[v.length>>1]});
  const dist=m=>i=>Math.max(Math.abs(px[i]-m[0]),Math.abs(px[i+1]-m[1]),Math.abs(px[i+2]-m[2]));
  let type='photo',med=null;
  if(fr(P,isW)>=.82||fr(Cn,isW)>=.92)type='white';
  else{const mP=md(P),mC=md(Cn),dP=dist(mP),dC=dist(mC);
    if(fr(P,i=>dP(i)<=28)>=.88){type='flat';med=mP}else if(fr(Cn,i=>dC(i)<=28)>=.92){type='flat';med=mC}}
  if(type==='flat'){ /* fonni chetdan boshlab oqqa boʻyaymiz */
    const df=dist(med),T=34,m=new Uint8Array(w*h),q=[];
    const seed=(x,y)=>{const j=y*w+x;if(!m[j]&&df(j*4)<=T){m[j]=1;q.push(j)}};
    for(let x=0;x<w;x++){seed(x,0);seed(x,h-1)}for(let y=0;y<h;y++){seed(0,y);seed(w-1,y)}
    for(let n=0;n<q.length;n++){const j=q[n],x=j%w,y=(j/w)|0;if(x>0)seed(x-1,y);if(x<w-1)seed(x+1,y);if(y>0)seed(x,y-1);if(y<h-1)seed(x,y+1)}
    if(q.length/(w*h)>.94)type='photo';
    else{for(let j=0;j<w*h;j++){const i=j*4;
      if(m[j]){px[i]=px[i+1]=px[i+2]=255;continue}
      const x=j%w,y=(j/w)|0;
      if((x>0&&m[j-1])||(x<w-1&&m[j+1])||(y>0&&m[j-w])||(y<h-1&&m[j+w])){const d=df(i);
        if(d<=T+36){const f=1-(d-T)/36;for(let c=0;c<3;c++)px[i+c]=Math.round(px[i+c]+(255-px[i+c])*f)}}}
      cx.putImageData(img,0,0)}
  }
  const out=document.createElement('canvas');out.width=out.height=S;const ox=out.getContext('2d');
  ox.fillStyle='#fff';ox.fillRect(0,0,S,S);ox.imageSmoothingQuality='high';
  if(type==='photo'){
    const ar=W/H;
    if(ar>=.62&&ar<=1.6){const c=Math.max(S/W,S/H);ox.drawImage(src,(S-W*c)/2,(S-H*c)/2,W*c,H*c)}
    else{ /* juda uzun yoki keng surat: kesmaymiz, chetlarining oʻrtacha rangi (oqqa yaqinlashtirilgan) fon boʻladi */
      let r=0,g=0,b=0;for(const i of P){r+=px[i];g+=px[i+1];b+=px[i+2]}
      r=Math.round((r/P.length+255)/2);g=Math.round((g/P.length+255)/2);b=Math.round((b/P.length+255)/2);
      ox.fillStyle='rgb('+r+','+g+','+b+')';ox.fillRect(0,0,S,S);
      const f=Math.min(S/W,S/H)*.96;ox.drawImage(src,(S-W*f)/2,(S-H*f)/2,W*f,H*f)}
  }else{
    const rc=new Uint16Array(h),cc=new Uint16Array(w);
    for(let y=0;y<h;y++)for(let x=0;x<w;x++){const i=(y*w+x)*4;if(px[i]<236||px[i+1]<236||px[i+2]<236){rc[y]++;cc[x]++}}
    let y0=0,y1=h-1,x0=0,x1=w-1;
    while(y0<y1&&rc[y0]<2)y0++;while(y1>y0&&rc[y1]<2)y1--;while(x0<x1&&cc[x0]<2)x0++;while(x1>x0&&cc[x1]<2)x1--;
    let bw=x1-x0+1,bh=y1-y0+1;if(bw*bh<.02*w*h||bw<4||bh<4){x0=y0=0;bw=w;bh=h}
    const f=Math.min(S*.86/bw,S*.86/bh),dw=bw*f,dh=bh*f,hi=type==='white',r=hi?1/k:1;
    const sx=Math.min(x0*r,(hi?W:w)-1),sy=Math.min(y0*r,(hi?H:h)-1);
    ox.drawImage(hi?src:cv,sx,sy,Math.min(bw*r,(hi?W:w)-sx),Math.min(bh*r,(hi?H:h)-sy),(S-dw)/2,(S-dh)/2,dw,dh);
  }
  return out;
}
window.SQ={build,done:u=>DONE.test(u||'')};
})();
</script>
<script>
const $=i=>document.getElementById(i),A=$('app');
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

async function api(u,b){
  let r;try{r=await fetch(u,b?{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(b)}:{})}catch(e){throw new Error('Server bilan aloqa yoʻq')}
  if(r.status===401&&u!=='/api/login'){D=null;login('Qayta kiring');throw new Error('Qayta kiring')}
  const j=await r.json().catch(()=>({}));if(!r.ok)throw new Error(j.error||'Xatolik ('+r.status+')');return j;
}
const run=async(fn)=>{try{return await fn()}catch(e){if(e&&e.message)toast(e.message,true)}};
function login(msg=''){
  if($('pw')){if(msg)$('le').textContent=msg;return}
  A.innerHTML=`<div class="lg"><h2>Sevimli Market · Panel</h2><input id="pw" type="password" placeholder="Parol" autocomplete="current-password"><div id="le" style="color:var(--r);min-height:20px;margin:8px 0">${esc(msg)}</div><button class="btn p" style="width:100%" id="lb">Kirish</button></div>`;
  const go=async()=>{try{await api('/api/login',{password:$('pw').value});load(true)}catch(e){$('le').textContent=e.message}};
  $('lb').onclick=go;$('pw').onkeydown=e=>{if(e.key==='Enter')go()};$('pw').focus();
}
function beep(){try{const c=new AudioContext(),o=c.createOscillator();o.connect(c.destination);o.frequency.value=880;o.start();o.stop(c.currentTime+.25)}catch(e){}}
async function load(first){
  try{
    const d=await api('/api/admin/data');d.groups=d.groups||[];d.printers=d.printers||[];d.prlog=d.prlog||[];
    if(first||!D){D=d;seen=d.orders.map(o=>o.id);view();return}
    const ids=d.orders.map(o=>o.id);
    if(ids.some(i=>!seen.includes(i))){beep();document.title='Yangi buyurtma! · Sevimli Market'}

}

document.addEventListener('input',e=>{const t=e.target;if(t.id==='uq'){US.q=t.value;$('ul').innerHTML=ulist()}if(t.id==='bct'){BC.text=t.value;const n=$('bcn');if(n)n.textContent=t.value.length+' / 4096'}});document.addEventListener('change',e=>{if(e.target.id==='bcm')BC.menu=e.target.checked});document.addEventListener('input',onEdit);document.addEventListener('change',onEdit);
document.addEventListener('change',e=>{const t=e.target;if(!t.dataset||t.dataset.cat===undefined||!D)return;const i=+t.dataset.cat,old=D.cats[i],nv=t.value.trim().slice(0,30);
  if(!nv||D.cats.some((c,k)=>k!==i&&c.toLowerCase()===nv.toLowerCase())){t.value=old;toast(!nv?'Nom boʻsh boʻlishi mumkin emas':'Bunday kategoriya allaqachon bor',true);return}
  D.menu.forEach(m=>{if(m.c===old)m.c=nv});D.groups.forEach(g=>g.cats=g.cats.map(x=>x===old?nv:x));D.cats[i]=nv;renTrack('c',old,nv);D.slides.forEach(sl=>{if(sl.lt==='cat'&&sl.lv==='c:'+old)sl.lv='c:'+nv});if(D.catimg&&D.catimg[old]){D.catimg[nv]=D.catimg[old];delete D.catimg[old]}if(OPEN['mc:'+old]!==undefined){OPEN['mc:'+nv]=OPEN['mc:'+old];delete OPEN['mc:'+old]}markDirty();view()});
/* ---- rasm yuklash ---- */
function pickFiles(multi,acc){return new Promise(res=>{const i=document.createElement('input');i.type='file';i.accept=acc||'image/*';i.multiple=!!multi;i.style.display='none';document.body.appendChild(i);i.onchange=()=>{res([...i.files]);i.remove()};i.click()})}
async function toJpeg(file,type,q){
  let bm;
  try{bm=await createImageBitmap(file,{imageOrientation:'from-image'})}catch(e){
    try{bm=await createImageBitmap(file)}catch(e2){
      bm=await new Promise((ok,no)=>{const im=new Image();im.onload=()=>ok(im);im.onerror=no;im.src=URL.createObjectURL(file)});
    }
  }
  const w=bm.width||bm.naturalWidth,h=bm.height||bm.naturalHeight,k=Math.min(1,1600/Math.max(w,h)),c=document.createElement('canvas');
  c.width=Math.max(1,Math.round(w*k));c.height=Math.max(1,Math.round(h*k));const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height);x.drawImage(bm,0,0,c.width,c.height);
  return c.toDataURL(type||'image/jpeg',q||.86);
}
async function toWebp(file){
  // Rasmni brauzerning oʻzida WebP'ga oʻtkazadi; brauzer WebP bermasa JPG qaytadi (server ikkalasini ham qabul qiladi)
  return toJpeg(file,'image/webp',.82);
}

  try{return await createImageBitmap(file,{imageOrientation:'from-image'})}catch(e){}
  try{return await createImageBitmap(file)}catch(e){}
  return new Promise((ok,no)=>{const im=new Image();im.onload=()=>ok(im);im.onerror=no;im.src=URL.createObjectURL(file)});
}

const sqData=c=>{let d=c.toDataURL('image/webp',.85);if(d.indexOf('data:image/webp')!==0)d=c.toDataURL('image/jpeg',.88);return d};
/* sq=true: mahsulot rasmi, bir xil kvadrat kadrga tayyorlanadi (mijoz saytida bir zumda va bir xil chiqadi) */
async function upload(file,sq){
  let data;
  try{data=sq?sqData(SQ.build(await openBitmap(file),800)):await toWebp(file)}
  catch(e){throw new Error('Rasmni oʻqib boʻlmadi: '+file.name+'. JPG yoki PNG fayl tanlang.')}

}

const LGN={acc:'Qabul qildi',cook:'Yigʻishni boshladi',rdy:'Tayyor qildi',cl:'Kuryer qabul qildi',way:'Yoʻlga chiqdi',dl:'Yetkazdi',cx:'Bekor qildi'},RTN={a:'admin chati',c:'kuryer chati',p:'panel'};

const ordV=(arch)=>[...D.orders].filter(o=>arch?o.st>=3:o.st<3).reverse().map(o=>`<div class="box ${o.st===0?'n0':''}"><div class="r"><b>#${o.id}</b><span class="bd">${new Date(o.t).toLocaleString('ru-RU')}</span></div>
<p style="margin:6px 0"><b>${esc(o.name)}</b> · <a href="tel:${esc(o.phone)}">${esc(o.phone)}</a>${o.uid?` · <a href="tg://user?id=${+o.uid}">Telegram</a>`:''}<br>${esc(o.addr)}${o.lat!=null?` · <a href="https://yandex.uz/maps/?pt=${+o.lng},${+o.lat}&z=17&l=map" target="_blank" rel="noopener">Xaritada ochish</a>`:''}${o.note?`<br><i>${esc(o.note)}</i>`:''}</p>
${o.items.map(i=>`<div class="r"><span>${esc(i.n)} × ${i.q}</span><span>${fmt(i.p*i.q)}</span></div>`).join('')}

tag:SVGI('<path d="M20.6 13.4l-7.2 7.2a2 2 0 0 1-2.8 0L3 13V3h10l7.6 7.6a2 2 0 0 1 0 2.8z"/><circle cx="7.5" cy="7.5" r="1.3"/>'),
box:SVGI('<path d="M21 8l-9-5-9 5 9 5 9-5z"/><path d="M3 8v8l9 5 9-5V8"/><path d="M12 13v8"/>'),

prn:SVGI('<path d="M7 9V3h10v6"/><rect x="3" y="9" width="18" height="8" rx="2"/><path d="M7 14h10v7H7z"/>'),
srch:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>'};
const OPEN={};document.addEventListener('toggle',e=>{const d=e.target;if(d.dataset&&d.dataset.k)OPEN[d.dataset.k]=d.open},true);

const tk=t=>new Date(t+5*36e5).toISOString().slice(0,10),addD=(k,n)=>new Date(Date.parse(k)+n*864e5).toISOString().slice(0,10),dm=k=>k.slice(8)+'.'+k.slice(5,7)+'.'+k.slice(0,4);
const PRE=[['0','Bugun'],['1','Kecha'],['7','7 kun'],['30','30 kun'],['90','90 kun'],['365','1 yil'],['c','Boshqa davr']];

function preRange(p){const t=tk(Date.now());if(p==='0')return[t,t];if(p==='1'){const y=addD(t,-1);return[y,y]}return[addD(t,-(+p-1)),t]}
function checkRange(f,t){
  if(!f||!t)return'Ikkala sanani ham tanlang';
  if(f>t)return'Boshlanish sanasi tugash sanasidan keyin boʻlmasligi kerak';
  if(t>tk(Date.now()))return'Kelajak sanasini tanlab boʻlmaydi';
  if((Date.parse(t)-Date.parse(f))/864e5+1>366)return'Davr 1 yildan oshmasligi kerak (eng koʻp 366 kun)';
  return'';
}
async function loadStats(){
  const[f,t]=SS.p==='c'?[SS.from,SS.to]:preRange(SS.p),e=checkRange(f,t);
  if(e){SS.err=e;view();return}
  SS.err='';SS.busy=true;view();
  try{SS.data=await api(`/api/admin/stats?from=${f}&to=${t}`)}catch(er){SS.err=er.message}
  SS.busy=false;view();
}
const shortN=n=>n>=1e6?(n/1e6).toFixed(n>=1e7?0:1).replace('.0','')+' mln':n>=1e3?Math.round(n/1e3)+' ming':String(n);
const dlt=(c,p)=>!p?(c?'<em class="up">yangi</em>':'<em>—</em>'):`<em class="${c>=p?'up':'dn'}">${c>=p?'▲':'▼'} ${Math.abs((c-p)/p*100).toFixed(Math.abs(c-p)/p>=1?0:1)}%</em>`;
function chart(days){
  const L=days.length;let g=[];
  if(L<=31)g=days.map(d=>({l:d.d.slice(8)+'.'+d.d.slice(5,7),t:dm(d.d),n:d.n,s:d.s}));
  else if(L<=120){for(let i=0;i<L;i+=7){const c=days.slice(i,i+7);g.push({l:c[0].d.slice(8)+'.'+c[0].d.slice(5,7),t:dm(c[0].d)+' – '+dm(c[c.length-1].d),n:c.reduce((a,x)=>a+x.n,0),s:c.reduce((a,x)=>a+x.s,0)})}}
  else{const m=new Map();for(const d of days){const k=d.d.slice(0,7),x=m.get(k)||{l:k.slice(5)+'.'+k.slice(2,4),t:k.slice(5)+'.'+k.slice(0,4),n:0,s:0};x.n+=d.n;x.s+=d.s;m.set(k,x)}g=[...m.values()]}
  const mx=Math.max(...g.map(x=>x.s));if(!mx)return'<div class="hint" style="padding:18px 0">Bu davrda yetkazilgan buyurtma yoʻq.</div>';
  const mag=10**Math.floor(Math.log10(mx)),top=Math.ceil(mx/mag*2)/2*mag,W=700,H=230,pl=76,pb=26,pt=12,bw=(W-pl)/g.length,ph=H-pb-pt,ev=Math.ceil(g.length/7);
  let s=`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Tushum grafigi">`;
  for(let i=0;i<=3;i++){const y=pt+ph-ph*i/3;s+=`<line x1="${pl}" x2="${W}" y1="${y}" y2="${y}" stroke="#00000014"/><text x="${pl-6}" y="${y+4}" text-anchor="end" fill="#8fa6b0" font-size="11">${shortN(Math.round(top*i/3))}</text>`}
  g.forEach((x,i)=>{const h=x.s/top*ph,bx=pl+i*bw+bw*.15,w=bw*.7;
    if(x.s>0)s+=`<rect x="${bx.toFixed(1)}" y="${(pt+ph-h).toFixed(1)}" width="${w.toFixed(1)}" height="${h.toFixed(1)}" rx="${Math.min(4,w/2).toFixed(1)}" fill="#55801a"><title>${x.t}: ${fmt(x.s)} · ${x.n} ta</title></rect>`;
    if(i%ev===0)s+=`<text x="${(pl+i*bw+bw/2).toFixed(1)}" y="${H-8}" text-anchor="middle" fill="#8fa6b0" font-size="11">${x.l}</text>`});
  return s+'</svg>';
}

function bcUp(blob,name,mime){return new Promise((ok,no)=>{const x=new XMLHttpRequest();x.open('POST','/api/admin/bc/file?name='+encodeURIComponent(name)+'&mime='+encodeURIComponent(mime));

  x.onload=()=>{let j={};try{j=JSON.parse(x.responseText)}catch(e){}x.status===200?ok(j):no(new Error(j.error||'Faylni yuklab boʻlmadi'))};x.onerror=()=>no(new Error('Aloqa uzildi, qayta urinib koʻring'));x.send(blob)})}
async function bcAttach(f){
  if(f.size>48*1048576)throw new Error('Fayl 48 MB dan kichik boʻlishi kerak. Videoni qisqartiring');
  let blob=f,name=f.name||'fayl',mime=f.type||'application/octet-stream';
  if(/^image\/(jpeg|png|webp|heic|heif)$/i.test(mime)){try{blob=dataToBlob(await toJpeg(f));mime='image/jpeg';name=name.replace(/\.\w+$/,'')+'.jpg'}catch(e){}}
  BC.busy=true;view();
  try{const r=await bcUp(blob,name,mime);BC.fid=r.fid;BC.name=r.name;BC.kind=r.kind;BC.size=r.size;BC.prev=r.kind==='photo'||r.kind==='animation'?URL.createObjectURL(blob):''}
  finally{BC.busy=false;view()}
}

    return((gs.length?'<div class="pgh">Asosiy kategoriyalar</div>'+gs.map(({g,n})=>lpItem('g:'+g.n,g.i?`<img src="${esc(g.i)}" alt="">`:IC.grp,g.n,n+' ta mahsulot',cur==='g:'+g.n)).join(''):'')+(cs.length?'<div class="pgh">Oddiy kategoriyalar</div>'+cs.map(({c,n})=>lpItem('c:'+c,IC.tag,c,n+' ta mahsulot',cur==='c:'+c)).join(''):''))||none}
  const L=act.filter(m=>!q||(m.n+' '+m.c).toLowerCase().includes(q));
  return(L.slice(0,80).map(m=>lpItem(String(m.id),m.img?`<img src="${esc(m.img)}" alt="">`:m.e?esc(m.e):IC.box,m.n,fmt(m.p)+(m.u?' / '+m.u:'')+(m.c?' · '+m.c:''),String(m.id)===cur)).join('')+(L.length>80?`<div class="hint" style="text-align:center">Yana ${L.length-80} ta bor: qidiruvdan foydalaning</div>`:''))||none};
function lpShow(){
  let h=$('lpw');if(!h){h=document.createElement('div');h.id='lpw';document.body.appendChild(h)}
  const c=LP.t==='cat';
  h.innerHTML=`<div class="mo" data-a="lpbg"><div class="md" role="dialog" aria-modal="true" aria-label="${c?'Kategoriyani tanlang':'Mahsulotni tanlang'}"><div class="mh"><h3>${c?'Kategoriyani tanlang':'Mahsulotni tanlang'}</h3><button class="btn ix" data-a="lpclose" aria-label="Yopish">×</button></div><div class="mb"><div class="mtool">${IC.srch}<input id="lpq" type="search" value="${esc(LP.q)}" placeholder="${c?'Kategoriya':'Mahsulot'} qidirish…" autocomplete="off"></div><div id="lpl" class="pl">${lpList()}</div></div></div></div>`;
  setTimeout(()=>{const q=$('lpq');if(q&&matchMedia('(hover:hover)').matches)q.focus()},30);
}
function lpClose(){const h=$('lpw');if(h)h.innerHTML='';LP=null}
document.addEventListener('input',e=>{if(e.target.id==='lpq'&&LP){LP.q=e.target.value;$('lpl').innerHTML=lpList()}});
document.addEventListener('keydown',e=>{if(LP&&e.key==='Escape')lpClose()});

load(true).then(()=>{if(!D)login()});
setInterval(()=>{if(D)load()},8000);
</script>
</body>
</html>
