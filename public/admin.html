<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Sevimli Market · Boshqaruv</title>
<link rel="icon" href="/favicon.png">
<style>
:root{--n:#001622;--n1:#04202f;--n2:#073147;--y:#55801a;--cr:#f4ecdc;--mut:#8fa6b0;--ln:#ffffff1c;--r:#ff6b6b;--g:#3ecf8e}
*{box-sizing:border-box}body{margin:0;background:var(--n);color:var(--cr);font:14px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
button{font:inherit;cursor:pointer;color:inherit;background:none;border:0}a{color:var(--y)}
.btn{border:1px solid var(--ln);background:var(--n1);border-radius:10px;padding:8px 14px;font-weight:600}.btn:hover{border-color:var(--y)}.btn.p{background:linear-gradient(135deg,#f0d58f,#55801a 55%,#a9812f);color:#241a05;border:0}.btn.d{color:var(--r)}.btn:disabled{opacity:.5}
input,select,textarea{font:inherit;padding:9px 11px;border:1px solid var(--ln);border-radius:10px;background:var(--n);color:var(--cr);width:100%}input:focus,select:focus,textarea:focus{outline:0;border-color:var(--y)}input[type=checkbox]{width:auto}
header{background:#00101a;border-bottom:1px solid #55801a44;padding:10px 20px;display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;position:sticky;top:0;z-index:5}header>span{display:flex;gap:12px;align-items:center}header b{font-family:Georgia,serif;font-size:18px;color:var(--y)}
.w{max-width:980px;margin:0 auto;padding:18px}
.lg{max-width:360px;margin:12vh auto;background:var(--n1);padding:26px;border-radius:18px;border:1px solid #55801a44}.lg h2{margin:0 0 14px;font-family:Georgia,serif;color:var(--y)}
.tabs{display:flex;gap:8px;margin-bottom:16px;flex-wrap:wrap}.tabs .on{background:var(--y);color:#241a05;border-color:var(--y)}
.st{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:16px}
.box{background:var(--n1);border:1px solid var(--ln);border-radius:14px;padding:14px;margin-bottom:12px}.st .box{margin:0;text-align:center;color:var(--mut)}.st b{display:block;font-size:20px;color:var(--y)}
.r{display:flex;justify-content:space-between;gap:8px;align-items:center}.n0{border-left:4px solid var(--y)}
.bd{font-size:12px;padding:2px 9px;border-radius:99px;background:var(--n2)}.bd.bad{background:#ff6b6b33;color:var(--r)}
.f{display:grid;gap:8px}.f2{display:grid;grid-template-columns:1fr 1fr;gap:8px}.f3{display:grid;grid-template-columns:1.4fr 1fr 110px;gap:8px}
label.l{font-size:12px;color:var(--mut);display:block;margin:2px 0}
.ph{width:64px;height:64px;border-radius:12px;border:1px dashed var(--mut);background:var(--n);display:grid;place-items:center;overflow:hidden;cursor:pointer;font-size:11px;color:var(--mut);text-align:center;flex:none;position:relative}.ph img{width:100%;height:100%;object-fit:cover}
.ph.big{width:110px;height:140px}.ph.xl{width:200px;height:250px}
.x{position:absolute;top:2px;right:2px;background:#000a;color:#fff;border-radius:50%;width:20px;height:20px;line-height:20px;font-size:13px}
.mi{display:grid;grid-template-columns:64px 1.4fr 1fr 110px 1.6fr auto auto;gap:8px;align-items:center;padding:10px 0;border-top:1px solid var(--ln)}
.gal{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:12px}.gi{background:var(--n);border:1px solid var(--ln);border-radius:12px;overflow:hidden}.gi img{width:100%;aspect-ratio:4/5;object-fit:cover;display:block}.gi div{padding:8px;display:grid;gap:6px}
.imgs{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:10px}
.hint{color:var(--mut);font-size:12px;margin:4px 0 10px}
#toast{position:fixed;right:16px;bottom:16px;display:grid;gap:8px;z-index:50}.t{background:#0b3d2b;color:#9ff0c8;border:1px solid var(--g);padding:10px 16px;border-radius:12px;box-shadow:0 10px 30px #000a}.t.bad{background:#4a1616;color:#ffb3b3;border-color:var(--r)}
.dish{padding:12px}.dtop{display:flex;gap:12px;align-items:flex-start}.chk{display:flex;gap:8px;align-items:center}input[type=checkbox]{accent-color:var(--y);width:18px;height:18px}
.bar{position:sticky;bottom:0;background:#001622e6;backdrop-filter:blur(8px);padding:10px 0;display:flex;gap:8px;z-index:4}
@media(max-width:760px){.st{grid-template-columns:1fr 1fr}.st .box:last-child{grid-column:span 2}.f2,.f3{grid-template-columns:1fr}.w{padding:12px}header b{font-size:15px}.tabs .btn{padding:8px 11px}}
.bd.s0{background:#55801a33;color:var(--y)}.bd.s1{background:#3b82f633;color:#9cc4ff}.bd.s2{background:#a78bfa33;color:#cdbbff}.bd.s3{background:#0b3d2b;color:#9ff0c8}.bd.s4{background:#ff6b6b33;color:var(--r)}
.tl{display:flex;gap:6px;font-size:12px;color:var(--mut);margin-top:5px;flex-wrap:wrap}.tl b{color:var(--cr)}.tl i{font-style:normal}.tl em{margin-left:auto;font-style:normal}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}.chips .btn.on{background:var(--y);color:#241a05;border-color:var(--y)}
.dr{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end;margin-bottom:12px}.dr>div{flex:1;min-width:150px}input[type=date]{color-scheme:dark}
.kp{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:12px}.kp .box{margin:0}.kp small{color:var(--mut);display:block;font-size:12px}.kp b{display:block;font-size:19px;color:var(--y);margin:2px 0}.kp em{font-style:normal;font-size:12px;color:var(--mut)}
.up{color:var(--g)!important}.dn{color:var(--r)!important}
.ch svg{width:100%;height:auto;display:block}
.tp{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr) auto auto;gap:10px;align-items:center;padding:7px 0;border-top:1px solid var(--ln);font-size:13px}.tp div{height:8px;background:var(--n2);border-radius:99px;overflow:hidden}.tp i{display:block;height:100%;background:var(--y);border-radius:99px}.tp em{font-style:normal;color:var(--mut);min-width:96px;text-align:right}
@media(max-width:760px){.kp{grid-template-columns:1fr 1fr}.tp{grid-template-columns:1fr auto}.tp div{grid-column:1/-1;order:3}.tp em{min-width:0}}
.hl{margin:0 0 14px;line-height:1.55}
.cr{display:flex;gap:8px;align-items:center;margin-bottom:8px;flex-wrap:wrap}.cr input{flex:1;min-width:140px}.cr.k input{flex:1 1 100%}.cr.k .bd{margin-right:auto}
.dirty{color:var(--mut);font-size:12px;text-align:center;flex:1}.dirty.on{color:var(--y);font-weight:700}
.how{margin-top:14px;font-size:13px;color:var(--cr)}.how summary{cursor:pointer;color:var(--y);font-weight:700}.how ol{margin:10px 0 0;padding-left:20px;line-height:1.7;color:var(--mut)}.how b{color:var(--cr)}
.pg{height:8px;background:var(--n2);border-radius:99px;overflow:hidden;margin:10px 0}.pg i{display:block;height:100%;background:var(--y);transition:width .4s}
.bcf{display:flex;gap:12px;align-items:center;margin-top:6px}.bcf img{width:64px;height:64px;object-fit:cover;border-radius:10px}.bcf small{display:block;color:var(--mut)}
.hi{display:flex;gap:8px;align-items:center;padding:9px 0;border-top:1px solid var(--ln)}.hi>div{flex:1;min-width:0;font-size:13px}.hi small{display:block;color:var(--mut);margin-top:2px}
.kp{grid-template-columns:repeat(auto-fit,minmax(150px,1fr))!important}

:root{--n:#f4f6f0;--n1:#fff;--n2:#e9eee0;--y:#55801a;--cr:#1d2a14;--mut:#6a7860;--ln:#dfe5d4;--r:#d93a3a;--g:#2e9e5b}
header{background:#fff;border-bottom:1px solid var(--ln)}header b,.lg h2{font-family:inherit;font-weight:800}.lg{border-color:var(--ln)}
.btn.p{background:var(--y);color:#fff}.tabs .on,.chips .btn.on{background:var(--y);color:#fff;border-color:var(--y)}.bar{background:#f4f6f0ee}
.t{background:#e6f6ec;color:#1b6b3a}.t.bad{background:#fde8e8;color:#a32020}input[type=date]{color-scheme:light}
.bd.s0{color:#8a5200;background:#fff0d6}.bd.s1{color:#1f5fbf;background:#e3eeff}.bd.s2{color:#6a3fc9;background:#eee8ff}.bd.s3{color:#1b6b3a;background:#e1f5e8}.bd.s4{color:#a32020;background:#fde8e8}
.cr.k input{flex:1 1 140px}.cr.k .ph{width:52px;height:52px}
.gbox{border:1px solid var(--ln);border-radius:14px;padding:12px;margin-top:10px;background:var(--n)}.gch{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px;align-items:center}
.chip{display:inline-flex;align-items:center;gap:6px;background:#fff;border:1px solid var(--ln);border-radius:99px;padding:5px 6px 5px 12px;font-size:13px;font-weight:600}.chip button{width:20px;height:20px;border-radius:50%;background:var(--n2);line-height:1}
.gch select{width:auto;padding:7px 10px;font-size:13px}
header{flex-wrap:nowrap}header b{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}header>span{flex:none}
.tabs{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}.tabs::-webkit-scrollbar{display:none}.tabs .btn{flex:none;white-space:nowrap}
.acc{background:var(--n1);border:1px solid var(--ln);border-radius:14px;margin-bottom:10px;overflow:hidden}
.acc>summary{list-style:none;cursor:pointer;display:flex;align-items:center;gap:12px;padding:10px 14px;min-height:58px;user-select:none}.acc>summary::-webkit-details-marker{display:none}
.acc .at{font-weight:700;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.acc .as{color:var(--mut);font-size:12.5px;white-space:nowrap}
.acc .ac{width:9px;height:9px;border-right:2px solid var(--mut);border-bottom:2px solid var(--mut);transform:rotate(45deg);transition:transform .2s;flex:none;margin:0 4px 4px 0}.acc[open]>summary .ac{transform:rotate(-135deg);margin:4px 4px 0 0}
.acc[open]>summary{border-bottom:1px solid var(--ln);background:#f9fbf5}.acc>.ab{padding:14px}.acc .acc{background:var(--n)}
.acc .th{width:40px;height:40px;border-radius:10px;background:var(--n);display:grid;place-items:center;overflow:hidden;flex:none;font-size:22px}.acc .th img{width:100%;height:100%;object-fit:cover}.acc.off .at,.acc.off .th{opacity:.45}
.acc .box,.acc .gbox{border:0;padding:0;margin:0;background:none}
.oact{display:flex;gap:8px;margin-top:12px}.oact .btn{flex:1;min-height:44px}
</style>
</head>
<body>
<div id="app"></div><div id="toast"></div>
<script>
const $=i=>document.getElementById(i),A=$('app');
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt=n=>Number(n).toLocaleString('ru-RU')+' soʻm',ST=['Yangi','Yigʻilmoqda','Yoʻlda','Yetkazildi','Bekor qilindi'];
let D=null,tab='orders',seen=null,busy=false;
function toast(m,bad){const t=document.createElement('div');t.className='t'+(bad?' bad':'');t.textContent=m;$('toast').appendChild(t);setTimeout(()=>t.remove(),4200)}
async function api(u,b){
  let r;try{r=await fetch(u,b?{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(b)}:{})}catch(e){throw new Error('Server bilan aloqa yoʻq')}
  if(r.status===401&&u!=='/api/login'){D=null;login('Qayta kiring');throw new Error('Qayta kiring')}
  const j=await r.json().catch(()=>({}));if(!r.ok)throw new Error(j.error||'Xatolik ('+r.status+')');return j;
}
const run=async(fn)=>{try{return await fn()}catch(e){if(e&&e.message)toast(e.message,true)}};
function login(msg=''){
  if($('pw')){if(msg)$('le').textContent=msg;return}
  A.innerHTML=`<div class="lg"><h2>Sevimli Market · Panel</h2><input id="pw" type="password" placeholder="Parol" autocomplete="current-password"><div id="le" style="color:var(--r);min-height:20px;margin:8px 0">${esc(msg)}</div><button class="btn p" style="width:100%" id="lb">Kirish</button></div>`;
  const go=async()=>{try{await api('/api/login',{password:$('pw').value});load(true)}catch(e){$('le').textContent=e.message}};
  $('lb').onclick=go;$('pw').onkeydown=e=>{if(e.key==='Enter')go()};$('pw').focus();
}
function beep(){try{const c=new AudioContext(),o=c.createOscillator();o.connect(c.destination);o.frequency.value=880;o.start();o.stop(c.currentTime+.25)}catch(e){}}
async function load(first){
  try{
    const d=await api('/api/admin/data');d.groups=d.groups||[];d.printers=d.printers||[];d.prlog=d.prlog||[];
    if(first||!D){D=d;seen=d.orders.map(o=>o.id);view();return}
    const ids=d.orders.map(o=>o.id);
    if(ids.some(i=>!seen.includes(i))){beep();document.title='Yangi buyurtma! · Sevimli Market'}
    seen=ids;D.orders=d.orders;D.tg=d.tg;D.today=d.today;
    if(tab==='orders'&&!document.activeElement.closest('select'))view();
  }catch(e){}
}
function setP(o,p,v){const k=p.split('.');let c=o;for(let i=0;i<k.length-1;i++)c=c[k[i]];c[k[k.length-1]]=v}
const onEdit=e=>{const t=e.target;if(!t.dataset||!t.dataset.p||!D)return;setP(D,t.dataset.p,t.type==='checkbox'?(t.checked?1:0):t.type==='number'?+t.value:t.value);if(t.dataset.p.indexOf('menu.')===0)markDirty()};
document.addEventListener('input',e=>{const t=e.target;if(t.id==='uq'){US.q=t.value;$('ul').innerHTML=ulist()}if(t.id==='bct'){BC.text=t.value;const n=$('bcn');if(n)n.textContent=t.value.length+' / 4096'}});document.addEventListener('change',e=>{if(e.target.id==='bcm')BC.menu=e.target.checked});document.addEventListener('input',onEdit);document.addEventListener('change',onEdit);
document.addEventListener('change',e=>{const t=e.target;if(!t.dataset||t.dataset.cat===undefined||!D)return;const i=+t.dataset.cat,old=D.cats[i],nv=t.value.trim().slice(0,30);
  if(!nv||D.cats.some((c,k)=>k!==i&&c.toLowerCase()===nv.toLowerCase())){t.value=old;toast(!nv?'Nom boʻsh boʻlishi mumkin emas':'Bunday kategoriya allaqachon bor',true);return}
  D.menu.forEach(m=>{if(m.c===old)m.c=nv});D.groups.forEach(g=>g.cats=g.cats.map(x=>x===old?nv:x));D.cats[i]=nv;markDirty();view()});
/* ---- rasm yuklash ---- */
function pickFiles(multi,acc){return new Promise(res=>{const i=document.createElement('input');i.type='file';i.accept=acc||'image/*';i.multiple=!!multi;i.style.display='none';document.body.appendChild(i);i.onchange=()=>{res([...i.files]);i.remove()};i.click()})}
async function toJpeg(file,type,q){
  let bm;
  try{bm=await createImageBitmap(file,{imageOrientation:'from-image'})}catch(e){
    try{bm=await createImageBitmap(file)}catch(e2){
      bm=await new Promise((ok,no)=>{const im=new Image();im.onload=()=>ok(im);im.onerror=no;im.src=URL.createObjectURL(file)});
    }
  }
  const w=bm.width||bm.naturalWidth,h=bm.height||bm.naturalHeight,k=Math.min(1,1600/Math.max(w,h)),c=document.createElement('canvas');
  c.width=Math.max(1,Math.round(w*k));c.height=Math.max(1,Math.round(h*k));const x=c.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,c.width,c.height);x.drawImage(bm,0,0,c.width,c.height);
  return c.toDataURL(type||'image/jpeg',q||.86);
}
async function toWebp(file){
  // Rasmni brauzerning oʻzida WebP'ga oʻtkazadi; brauzer WebP bermasa JPG qaytadi (server ikkalasini ham qabul qiladi)
  return toJpeg(file,'image/webp',.82);
}
async function upload(file){
  let data;try{data=await toWebp(file)}catch(e){throw new Error('Rasmni oʻqib boʻlmadi: '+file.name+'. JPG yoki PNG fayl tanlang.')}
  const d=await api('/api/admin/upload',{data});return d.url;
}
/* ---- koʻrinishlar ---- */
const LGN={acc:'Qabul qildi',cook:'Yigʻishni boshladi',rdy:'Tayyor qildi',cl:'Kuryer qabul qildi',way:'Yoʻlga chiqdi',dl:'Yetkazdi',cx:'Bekor qildi'},RTN={a:'admin chati',c:'kuryer chati',p:'panel'};
const hmT=t=>new Date(t).toLocaleTimeString('ru-RU',{timeZone:'Asia/Tashkent',hour:'2-digit',minute:'2-digit'});
const lab=o=>o.st===1?((o.log||[]).some(e=>e.k==='rdy')?'Tayyor':(o.log||[]).some(e=>e.k==='cook')?'Yigʻilmoqda':'Qabul qilindi'):ST[o.st];
const tl=o=>(o.log||[]).filter(e=>LGN[e.k]).map(e=>`<div class="tl"><span>${LGN[e.k]}:</span><b>${esc(e.by||'')}</b><i>(${RTN[e.r]||''})</i><em>${hmT(e.t)}</em></div>`).join('');
const ordV=(arch)=>[...D.orders].filter(o=>arch?o.st>=3:o.st<3).reverse().map(o=>`<div class="box ${o.st===0?'n0':''}"><div class="r"><b>#${o.id}</b><span class="bd">${new Date(o.t).toLocaleString('ru-RU')}</span></div>
<p style="margin:6px 0"><b>${esc(o.name)}</b> · <a href="tel:${esc(o.phone)}">${esc(o.phone)}</a>${o.uid?` · <a href="tg://user?id=${+o.uid}">Telegram</a>`:''}<br>${esc(o.addr)}${o.lat!=null?` · <a href="https://yandex.uz/maps/?pt=${+o.lng},${+o.lat}&z=17&l=map" target="_blank" rel="noopener">Xaritada ochish</a>`:''}${o.note?`<br><i>${esc(o.note)}</i>`:''}</p>
${o.items.map(i=>`<div class="r"><span>${esc(i.n)} × ${i.q}</span><span>${fmt(i.p*i.q)}</span></div>`).join('')}
${o.fee?`<div class="r"><span>Yetkazish${o.km?' ('+o.km+' km)':''}${o.es||o.ax?' · taxminiy':''}</span><span>${fmt(o.fee)}</span></div>`:''}<div class="r" style="margin:8px 0"><b>Jami · ${esc(o.pay)}</b><b>${fmt(o.total)}</b></div>
<div class="r"><span>${D.tg.on?`<span class="bd s${o.st}">${lab(o)}</span>`:`<select data-s="${o.id}" style="max-width:220px">${ST.map((s,k)=>`<option value="${k}" ${k===o.st?'selected':''}>${s}</option>`).join('')}</select>`}</span>
${o.tg===false?`<span><span class="bd bad">Telegramga yuborilmadi</span> <button class="btn" data-a="resend" data-i="${o.id}">Qayta yuborish</button></span>`:o.tg?'<span class="bd">Telegramga yuborildi</span>':''}</div><div class="oact">${o.st===0?`<button class="btn p" data-a="oacc" data-i="${o.id}">Qabul qilish</button>`:''}<button class="btn" data-a="oprint" data-i="${o.id}">🖨 Chek</button></div>${tl(o)}</div>`).join('')||'<div class="box">Hozircha buyurtma yoʻq.</div>';
const phs=(img,p,a)=>`<div class="ph ${a||''}" data-a="img" data-p="${p}">${img?`<img src="${esc(img)}" alt=""><button class="x" data-a="imgx" data-p="${p}" title="Olib tashlash">×</button>`:'Rasm<br>qoʻshish'}</div>`;
/* ---- menyu va kategoriyalar ---- */
let MF='Hammasi',DIRTY=false,SUB={orders:'act',site:'slides'};
const OPEN={};document.addEventListener('toggle',e=>{const d=e.target;if(d.dataset&&d.dataset.k)OPEN[d.dataset.k]=d.open},true);
const acc=(k,head,sub,body,def,cls)=>`<details class="acc ${cls||''}" data-k="${k}" ${(k in OPEN?OPEN[k]:(OPEN[k]=!!def))?'open':''}><summary>${head}<span class="as">${sub||''}</span><i class="ac"></i></summary><div class="ab">${body}</div></details>`;
const H=t=>`<div class="hint hl">${t}</div>`;
const chips=(items,cur,act)=>`<div class="chips">${items.map(([k,v])=>`<button class="btn ${cur===k?'on':''}" data-a="${act}" data-i="${esc(k)}">${esc(v)}</button>`).join('')}</div>`;

const tk=t=>new Date(t+5*36e5).toISOString().slice(0,10),addD=(k,n)=>new Date(Date.parse(k)+n*864e5).toISOString().slice(0,10),dm=k=>k.slice(8)+'.'+k.slice(5,7)+'.'+k.slice(0,4);
const PRE=[['0','Bugun'],['1','Kecha'],['7','7 kun'],['30','30 kun'],['90','90 kun'],['365','1 yil'],['c','Boshqa davr']];
let SS={p:'7',from:'',to:'',data:null,err:'',busy:false};
function preRange(p){const t=tk(Date.now());if(p==='0')return[t,t];if(p==='1'){const y=addD(t,-1);return[y,y]}return[addD(t,-(+p-1)),t]}
function checkRange(f,t){
  if(!f||!t)return'Ikkala sanani ham tanlang';
  if(f>t)return'Boshlanish sanasi tugash sanasidan keyin boʻlmasligi kerak';
  if(t>tk(Date.now()))return'Kelajak sanasini tanlab boʻlmaydi';
  if((Date.parse(t)-Date.parse(f))/864e5+1>366)return'Davr 1 yildan oshmasligi kerak (eng koʻp 366 kun)';
  return'';
}
async function loadStats(){
  const[f,t]=SS.p==='c'?[SS.from,SS.to]:preRange(SS.p),e=checkRange(f,t);
  if(e){SS.err=e;view();return}
  SS.err='';SS.busy=true;view();
  try{SS.data=await api(`/api/admin/stats?from=${f}&to=${t}`)}catch(er){SS.err=er.message}
  SS.busy=false;view();
}
const shortN=n=>n>=1e6?(n/1e6).toFixed(n>=1e7?0:1).replace('.0','')+' mln':n>=1e3?Math.round(n/1e3)+' ming':String(n);
const dlt=(c,p)=>!p?(c?'<em class="up">yangi</em>':'<em>—</em>'):`<em class="${c>=p?'up':'dn'}">${c>=p?'▲':'▼'} ${Math.abs((c-p)/p*100).toFixed(Math.abs(c-p)/p>=1?0:1)}%</em>`;
function chart(days){
  const L=days.length;let g=[];
  if(L<=31)g=days.map(d=>({l:d.d.slice(8)+'.'+d.d.slice(5,7),t:dm(d.d),n:d.n,s:d.s}));
  else if(L<=120){for(let i=0;i<L;i+=7){const c=days.slice(i,i+7);g.push({l:c[0].d.slice(8)+'.'+c[0].d.slice(5,7),t:dm(c[0].d)+' – '+dm(c[c.length-1].d),n:c.reduce((a,x)=>a+x.n,0),s:c.reduce((a,x)=>a+x.s,0)})}}
  else{const m=new Map();for(const d of days){const k=d.d.slice(0,7),x=m.get(k)||{l:k.slice(5)+'.'+k.slice(2,4),t:k.slice(5)+'.'+k.slice(0,4),n:0,s:0};x.n+=d.n;x.s+=d.s;m.set(k,x)}g=[...m.values()]}
  const mx=Math.max(...g.map(x=>x.s));if(!mx)return'<div class="hint" style="padding:18px 0">Bu davrda yetkazilgan buyurtma yoʻq.</div>';
  const mag=10**Math.floor(Math.log10(mx)),top=Math.ceil(mx/mag*2)/2*mag,W=700,H=230,pl=76,pb=26,pt=12,bw=(W-pl)/g.length,ph=H-pb-pt,ev=Math.ceil(g.length/7);
  let s=`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Tushum grafigi">`;
  for(let i=0;i<=3;i++){const y=pt+ph-ph*i/3;s+=`<line x1="${pl}" x2="${W}" y1="${y}" y2="${y}" stroke="#00000014"/><text x="${pl-6}" y="${y+4}" text-anchor="end" fill="#8fa6b0" font-size="11">${shortN(Math.round(top*i/3))}</text>`}
  g.forEach((x,i)=>{const h=x.s/top*ph,bx=pl+i*bw+bw*.15,w=bw*.7;
    if(x.s>0)s+=`<rect x="${bx.toFixed(1)}" y="${(pt+ph-h).toFixed(1)}" width="${w.toFixed(1)}" height="${h.toFixed(1)}" rx="${Math.min(4,w/2).toFixed(1)}" fill="#55801a"><title>${x.t}: ${fmt(x.s)} · ${x.n} ta</title></rect>`;
    if(i%ev===0)s+=`<text x="${(pl+i*bw+bw/2).toFixed(1)}" y="${H-8}" text-anchor="middle" fill="#8fa6b0" font-size="11">${x.l}</text>`});
  return s+'</svg>';
}

    else if(a==='mf'){MF=t.dataset.i;view()}
    else if(a==='bcpick'){const f=(await pickFiles(false,'image/*,video/*'))[0];if(f)await bcAttach(f)}
    else if(a==='bcx'){BC.fid='';BC.name='';BC.prev='';view()}
    else if(a==='bctest')await bcSend(true);
    else if(a==='bcgo')await bcSend(false);
    else if(a==='bcdone'){BC.mine=0;const s=$('bcst');if(s)s.innerHTML=bcStatus()}
    else if(a==='bccancel'){await api('/api/admin/bc/cancel',{});toast('Toʻxtatilmoqda');bcLoad()}
    else if(a==='osub'){SUB.orders=t.dataset.i;view()}
    else if(a==='setsave'){const r=await api('/api/admin/settings',{settings:D.settings});D.settings=r.settings;D.ymap=r.ymap;view();toast('Saqlandi')}
    else if(a==='sadd'){D.slides.push({id:Date.now(),a:1,bg:'g',e:'',k:'Aksiya',h:'Yangi *banner*',p:'',b:'Xarid qilish',l:'#menu',i1:''});view()}
    else if(a==='sdel'){if(confirm('Slayd oʻchirilsinmi?')){D.slides.splice(i,1);view()}}
    else if(a==='sup'||a==='sdn'){const j=a==='sup'?i-1:i+1;[D.slides[i],D.slides[j]]=[D.slides[j],D.slides[i]];view()}
    else if(a==='ssave'){const r=await api('/api/admin/slides',{slides:D.slides});D.slides=r.slides;view();toast('Saqlandi')}
    else if(a==='ytest'){
      $('ytr').textContent='Tekshirilmoqda…';const r=await api('/api/admin/ytest',{});
      const f=(n,x)=>`<div>${n}: <b style="color:${x.ok?'#6fd68b':'#ff8a8a'}">${x.ok?'ishlayapti':'xato'}</b> (${x.status||'ulanmadi'})${x.msg?' — '+esc(x.msg):''}</div>`;
      $('ytr').innerHTML=f('Geokoder kaliti',r.geo)+f('Xarita kaliti',r.js)+`<div>Manzil sinovi (doʻkon nuqtasi): <b>${esc(r.rev||'—')}</b>${r.revsrc?' · manba: '+esc(r.revsrc):''}</div>`+(r.revlog&&r.revlog.length?`<div>Tafsilot: ${r.revlog.map(esc).join('<br>')}</div>`:'')+`<div>Server versiyasi: ${esc(r.build||'?')}${r.info?' · '+esc(r.info):''}</div>`+(r.yerr?`<div>Oxirgi Yandex geokoder xatosi: <b>${esc(r.yerr)}</b></div>`:'')+(r.map?`<div>Brauzerdagi oxirgi xarita xatosi: <b>${esc(r.map.e)}</b>${r.map.csp?' · CSP: '+esc(r.map.csp):''}</div>`:'<div>Brauzerda xarita xatosi qayd etilmagan.</div>');
    }
    else if(a==='qtest'){
      const q=$('qa').value.trim();if(!q)throw new Error('Sinash uchun manzilni yozing');$('qtr').textContent='Hisoblanmoqda…';
      try{const cm=q.match(/^\s*(-?\d+(?:\.\d+)?)\s*[, ]\s*(-?\d+(?:\.\d+)?)\s*$/),r=await api('/api/admin/quote',cm?{lat:+cm[1],lng:+cm[2]}:{addr:q});$('qtr').innerHTML=r.on===0?'Yetkazish narxi oʻchirilgan (yuqoridagi katakcha).':`Topilgan joy: <b>${esc(r.found||'—')}</b><br>Masofa: <b>${r.km} km</b> · Yetkazish narxi: <b>${fmt(r.fee)}</b>${r.apx?'<br><span style="color:var(--y)">Manzil taxminiy aniqlandi (aniq uy topilmadi)</span>':''}${r.est?'<br><span style="color:var(--y)">Masofa taxminiy: yoʻl xizmati javob bermadi</span>':''}`}
      catch(er){$('qtr').innerHTML='<span style="color:var(--r)">'+esc(er.message)+'</span>'}
    }
    else if(a==='tgtest'){$('tgr').textContent='Yuborilmoqda…';const r=await api('/api/admin/telegram-test',{});$('tgr').innerHTML=r.ok?`<span class="bd s3">Muvaffaqiyatli: ${esc(r.bot)}</span><div class="hint">${(r.chats||[]).map(esc).join('<br>')}</div>`:`<span class="bd bad">Xato: ${esc(r.error)}</span>`}
  });
});
document.addEventListener('change',e=>{const t=e.target;if(t.dataset&&t.dataset.s&&D)run(async()=>{await api('/api/admin/status',{id:+t.dataset.s,st:+t.value});const o=D.orders.find(x=>x.id==t.dataset.s);if(o)o.st=+t.value;if(+t.value===1&&o)printBrowser(o);toast(+t.value>=3?'Arxivga oʻtkazildi':'Holat yangilandi');view()})});
load(true).then(()=>{if(!D)login()});
setInterval(()=>{if(D)load()},8000);
</script>
</body>
</html>
