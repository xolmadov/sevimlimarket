function mkYandex(){

    root.querySelectorAll('*').forEach(el=>{
      if(el.shadowRoot)scan(el.shadowRoot);
      const t=txt(el);if(t.length>90||!RX.test(t)||[...el.children].some(c=>RX.test(txt(c))))return;

  [400,1200,3000].forEach(ms=>setTimeout(()=>{hideOpen();if(ms===3000)try{fetch('/api/maplog',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({i:'Ochish tugmasi yashirildi: '+hn+' ta'})})}catch(e){}},ms));
  map.addChild(new YMapListener({layer:'any',onUpdate:({location,mapInAction})=>{lastU=Date.now();ctr=location.center;z=location.zoom;if(mapInAction){if(!was){was=true;cbS()}}else{was=false;cbE()}}}));
  setInterval(()=>{if(was&&Date.now()-lastU>900){was=false;cbE()}},400); // «harakat tugadi» hodisasi kelmay qolsa ham manzil aniqlanaveradi
  return {center:()=>({lat:ctr[1],lng:ctr[0]}),set:(a,b,zz)=>{ctr=[b,a];z=zz||17;lastU=Date.now();map.update({location:{center:[b,a],zoom:z}})},start:f=>{cbS=f},end:f=>{cbE=f},resize:()=>{},zoom:d=>map.update({location:{zoom:Math.max(3,Math.min(19,z+d)),duration:200}})};
